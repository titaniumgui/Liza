plugins {
    id 'com.android.application'
}

// Release signing: point the Gradle property `liza.signing` (for example in
// ~/.gradle/gradle.properties) at a keystore.properties file with storeFile,
// storePassword, keyAlias and keyPassword, or put keystore.properties in the
// project root. Both stay out of git. Without it, release builds are unsigned.
def signingFile = project.hasProperty('liza.signing')
        ? file(project.property('liza.signing'))
        : rootProject.file('keystore.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'app.liza.android'
    compileSdk 35

    defaultConfig {
        applicationId 'app.liza.android'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        if (signingProps.storeFile) {
            release {
                storeFile file(signingProps.storeFile)
                storePassword signingProps.storePassword
                keyAlias signingProps.keyAlias
                keyPassword signingProps.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // No code shrinking: the EZVIZ SDK uses reflection and JNI.
            minifyEnabled false
            if (signingProps.storeFile) signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            // Keep the EZVIZ SDK's native libraries compressed in the APK.
            // With minSdk 23 AGP stores them uncompressed by default, which
            // more than doubles the download size.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'io.github.ezviz-open:ezviz-sdk:5.33.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.google.code.gson:gson:2.8.5'
}
